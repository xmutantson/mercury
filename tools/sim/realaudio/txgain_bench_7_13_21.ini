; Bench transmit calibration carried by the IONOS bench Pis in
; ~/.config/mercury/mercury.ini (plan 7.13.21).
;
; The single-tone MFSK gains the plan names (MFSK / ACK / HAIL / BREAK; the
; modem's [TxGain] keys for them are MFSK_1S, ACK and BREAK) are lowered from
; the code default 5.24 to 3.62 on WB, a factor of 3.62 / 5.24 = 0.691
; (-3.21 dB; the plan quotes 0.690x), so they reach the bench's calibrated
; level together with OFDM. NB carries the same factor on its own default:
; 5.24 * sqrt(50/10) = 11.717 -> 11.717 * 0.691 = 8.09.
; MFSK_2S and OFDM are not overridden (code defaults).
;
; Use: arq_realaudio.py --tx-gain-ini <this file>   (or MERCURY_SIM_TXGAIN_INI)
[TxGain]
MFSK_1S_WB=3.62
ACK_WB=3.62
BREAK_WB=3.62
MFSK_1S_NB=8.09
ACK_NB=8.09
BREAK_NB=8.09
