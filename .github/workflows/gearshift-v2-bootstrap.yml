name: Gearshift v2 PR bootstrap

on:
  push:
    branches:
      - gearshift-v2-baseline-pr
    paths:
      - .gearshift-bootstrap/READY

permissions:
  contents: write

jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source diffs
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .gearshift-bootstrap/baseline.part-00 \
            .gearshift-bootstrap/baseline.part-01 \
            .gearshift-bootstrap/baseline.part-02 \
            .gearshift-bootstrap/baseline.part-03 \
            .gearshift-bootstrap/baseline.part-04 \
            .gearshift-bootstrap/baseline.part-05 \
            .gearshift-bootstrap/baseline.part-06 \
            .gearshift-bootstrap/baseline.part-07 \
            .gearshift-bootstrap/tail.part-00 \
            .gearshift-bootstrap/tail.part-01 \
            .gearshift-bootstrap/tail.part-02 \
            .gearshift-bootstrap/tail.part-03 \
            .gearshift-bootstrap/tail.part-04 \
            .gearshift-bootstrap/tail.part-05 \
            .gearshift-bootstrap/tail.part-06 \
            .gearshift-bootstrap/tail.part-07 \
            | tr -d '\r\n' | base64 -d | xz -d > /tmp/gearshift-baseline.patch

          cat .gearshift-bootstrap/p3.part-00 \
              .gearshift-bootstrap/p3.part-01 \
              .gearshift-bootstrap/p3.part-02 \
              .gearshift-bootstrap/p3.part-03 \
            | tr -d '\r\n' | base64 -d | xz -d > /tmp/gearshift-bench-fixes.patch

          echo '8a48a4397b916a323d0f791ef3258eacd3e830910ed3e375440316ef1eada0d8  /tmp/gearshift-baseline.patch' | sha256sum -c -
          echo 'fba6968955f3e48f4d90617b6f1c8aa2fa702eb630cd357c46bfefd444db95dc  /tmp/gearshift-bench-fixes.patch' | sha256sum -c -

      - name: Apply Gearshift v2 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a08f1b8cc33ad3b0ad386edc524995f1027a0c20" || true
          git apply --check /tmp/gearshift-baseline.patch
          git apply /tmp/gearshift-baseline.patch
          git diff --check
          git apply --check /tmp/gearshift-bench-fixes.patch
          git apply /tmp/gearshift-bench-fixes.patch
          git diff --check

      - name: Run Gearshift CPU suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/cpu/run_gearshift_tests.sh
          ./tests/cpu/run_gearshift_tests.sh

      - name: Replace bootstrap history with source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gearshift-bootstrap
          rm -f .github/workflows/gearshift-v2-bootstrap.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'gearshift-v2: integrate adaptive controller and bench lifecycle fixes'
          git push origin HEAD:gearshift-v2-baseline-pr
